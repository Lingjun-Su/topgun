  fields:
    id: { type: "bigint" }
    code: { type: "varchar", note: "订单校验中的 bus_code 对应此列" }
    name: { type: "varchar" }
  source: ["database_schema", "verified_code"]
  confidence: "confirmed"

db.table.carrier:
