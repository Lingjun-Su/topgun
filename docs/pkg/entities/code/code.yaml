# 代码实体（关键实现）

# 订单接收入口
code.backend.receiver_controller:
  id: "code.backend.receiver_controller"
  type: "code"
  language: "php"
  framework: "laravel"
  name: "ReceiverController"
  path: "app/Http/Controllers/API/ThirdChannel/ReceiverController.php"
  module: "module.order"
  class: "App\\Http\\Controllers\\API\\ThirdChannel\\ReceiverController"
  responsibility:
    - "v2 订单接收（store）与状态更新（update）"
    - "验证码提交（verifySubmit）触发 submit 步骤"
    - "转发记录查询（queryForward）"
    - "自动中转判定与创建（dispatchForwardIfNeeded）"
  source: ["verified_code"]
  confidence: "confirmed"

# 中转转发放核心
code.backend.forward_service:
  id: "code.backend.forward_service"
  type: "code"
  language: "php"
  framework: "laravel"
  name: "ForwardService"
  path: "app/Services/ThirdChannel/ForwardService.php"
  module: "module.order"
  class: "App\\Services\\ThirdChannel\\ForwardService"
  responsibility:
    - "同步执行单步转发（executeStep：getCode=0 / submit=1）"
    - "合并 source_data + step_data + 请求映射 + 签名 + HTTP 推送 + 结果判定"
    - "成功判定优先级：步骤级 success_rule > 渠道级 push_success_rule > 默认 data.code==00000"
  source: ["verified_code"]
  confidence: "confirmed"

