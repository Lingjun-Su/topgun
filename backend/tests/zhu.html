<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GodawnAI API 测试工具</title>
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --bg-input: #0d1117;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #bc8cff;
            --accent-red: #f85149;
            --user-bubble: #1f6feb;
            --assistant-bubble: #2d333b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            --max-width: 960px;
        }

        /* ===== 重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* ===== 容器 ===== */
        .app {
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .logo {
            font-size: 28px;
        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header-left h1 span {
            color: var(--accent-blue);
        }
        .header-left .badge {
            font-size: 11px;
            background: var(--accent-blue);
            color: #0d1117;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 6px;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .header-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ===== 配置卡片 ===== */
        .config-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 18px;
        }
        .config-card .field {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 180px;
            min-width: 140px;
        }
        .config-card .field label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .config-card .field input,
        .config-card .field select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font);
            width: 100%;
            min-width: 100px;
            outline: none;
            transition: border var(--transition);
        }
        .config-card .field input:focus,
        .config-card .field select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        .config-card .field input[type="password"] {
            letter-spacing: 2px;
        }
        .config-card .field .toggle-vis {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background var(--transition);
            line-height: 1;
        }
        .config-card .field .toggle-vis:hover {
            background: var(--border-color);
        }
        .config-card .field .api-key-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .config-card .field .api-key-wrap input {
            flex: 1;
        }

        .config-card .field-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .config-card .field-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .config-card .actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .config-card .actions button {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .config-card .actions button:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }
        .config-card .actions button.primary {
            background: var(--accent-blue);
            color: #0d1117;
            border-color: var(--accent-blue);
            font-weight: 600;
        }
        .config-card .actions button.primary:hover {
            background: #79c0ff;
            border-color: #79c0ff;
        }
        .config-card .actions button.danger {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
        .config-card .actions button.danger:hover {
            background: var(--accent-red);
            color: #0d1117;
        }

        /* ===== System Prompt ===== */
        .system-row {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .system-row label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .system-row input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            min-width: 120px;
            transition: border var(--transition);
        }
        .system-row input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        /* ===== 对话区域 ===== */
        .chat-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            flex: 1;
            min-height: 360px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .msg {
            display: flex;
            gap: 12px;
            max-width: 88%;
            animation: fade-in 0.3s ease;
        }
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg.assistant {
            align-self: flex-start;
        }
        .msg .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            user-select: none;
        }
        .msg.user .avatar {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        .msg.assistant .avatar {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
        }
        .msg .bubble {
            background: var(--assistant-bubble);
            padding: 10px 16px;
            border-radius: var(--radius);
            border-top-left-radius: 4px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
            position: relative;
            border: 1px solid var(--border-color);
        }
        .msg.user .bubble {
            background: var(--user-bubble);
            border-color: var(--user-bubble);
            border-top-right-radius: 4px;
            border-top-left-radius: var(--radius);
            color: #fff;
        }
        .msg .bubble .role-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
        }
        .msg.user .bubble .role-label {
            color: rgba(255, 255, 255, 0.7);
        }
        .msg .bubble .timestamp {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            display: block;
            text-align: right;
        }
        .msg.user .bubble .timestamp {
            color: rgba(255, 255, 255, 0.5);
        }
        .msg .bubble .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent-blue);
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .msg .bubble .error-text {
            color: var(--accent-red);
        }
        .msg .bubble .model-tag {
            font-size: 10px;
            background: var(--bg-input);
            padding: 1px 8px;
            border-radius: 12px;
            color: var(--text-secondary);
            display: inline-block;
            margin-top: 4px;
        }
        .msg .bubble .video-container {
            margin-top: 8px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            max-width: 100%;
        }
        .msg .bubble .video-container video,
        .msg .bubble .video-container img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            display: block;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 10px;
            padding: 30px 20px;
            text-align: center;
        }
        .empty-state .icon {
            font-size: 48px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 13px;
            max-width: 360px;
        }

        /* ===== 输入区域 ===== */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .input-area textarea {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            resize: vertical;
            min-height: 44px;
            max-height: 150px;
            outline: none;
            transition: border var(--transition);
            line-height: 1.5;
        }
        .input-area textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
        }
        .input-area textarea::placeholder {
            color: var(--text-muted);
        }
        .input-area .btn-send {
            background: var(--accent-blue);
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 22px;
            color: #0d1117;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-area .btn-send:hover:not(:disabled) {
            background: #79c0ff;
            transform: scale(1.02);
        }
        .input-area .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .input-area .btn-send .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(13, 17, 23, 0.2);
            border-top-color: #0d1117;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header-left h1 {
                font-size: 17px;
            }
            .header-left .badge {
                font-size: 9px;
                padding: 1px 8px;
            }
            .config-card {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .config-card .field {
                flex: 1 1 auto;
                min-width: unset;
            }
            .config-card .actions {
                margin-left: 0;
                justify-content: flex-end;
            }
            .system-row {
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .chat-messages {
                padding: 12px 14px;
            }
            .msg {
                max-width: 95%;
            }
            .input-area {
                padding: 10px 14px;
                flex-wrap: wrap;
            }
            .input-area textarea {
                min-height: 38px;
                font-size: 13px;
            }
            .input-area .btn-send {
                padding: 8px 16px;
                height: 38px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .header-left .logo {
                font-size: 22px;
            }
            .header-left h1 {
                font-size: 15px;
            }
            .config-card .field label {
                font-size: 12px;
                min-width: 50px;
            }
            .config-card .field input,
            .config-card .field select {
                font-size: 12px;
                padding: 5px 10px;
            }
            .msg .bubble {
                font-size: 13px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🧪</span>
                <h1>Godawn<span>AI</span> 测试台</h1>
                <span class="badge">v1.0</span>
            </div>
            <div class="header-status">
                <span class="dot"></span>
                <span>API 就绪</span>
            </div>
        </header>

        <!-- ===== 配置卡片 ===== -->
        <div class="config-card">
            <div class="field">
                <label>🔑 API Key</label>
                <div class="api-key-wrap">
                    <input type="password" id="apiKey" placeholder="sk-..." />
                    <button class="toggle-vis" id="toggleKey" title="显示/隐藏">👁️</button>
                </div>
            </div>

            <div class="field">
                <label>🤖 模型</label>
                <select id="modelSelect"></select>
            </div>

            <div class="field field-check">
                <input type="checkbox" id="streamToggle" checked />
                <label for="streamToggle">流式输出</label>
            </div>

            <div class="actions">
                <button id="saveConfigBtn" class="primary">💾 保存</button>
                <button id="clearChatBtn" class="danger">🗑️ 清空</button>
            </div>
        </div>

        <!-- ===== System Prompt ===== -->
        <div class="system-row">
            <label>📋 System</label>
            <input type="text" id="systemPrompt" placeholder="可选的系统提示词…" />
        </div>

        <!-- ===== 对话区域 ===== -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <h3>开始对话</h3>
                    <p>输入消息并点击发送，即可测试 GodawnAI 聚合平台的各种模型。</p>
                </div>
            </div>

            <div class="input-area">
                <textarea id="userInput" rows="1" placeholder="输入消息… (Shift+Enter 换行)"></textarea>
                <button class="btn-send" id="sendBtn">
                    <span>发送</span>
                </button>
            </div>
        </div>

        <!-- ===== 底部信息 ===== -->
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);padding:0 4px 4px;flex-wrap:wrap;gap:6px;">
            <span>⚡ 端点: <code style="background:var(--bg-card);padding:1px 8px;border-radius:4px;">https://api.godawnai.com/v1/chat/completions</code></span>
            <span id="statusBar">就绪</span>
        </div>
    </div>

    <script>
        // ============================================================
        //  数据
        // ============================================================
        const MODELS = [{
            id: 'deepseek-v4-flash',
            label: 'DeepSeek V4 Flash',
            provider: '深度求索',
            type: '对话',
        }, {
            id: 'deepseek-v4-pro',
            label: 'DeepSeek V4 Pro',
            provider: '深度求索',
            type: '对话',
        }, {
            id: 'glm-5.2',
            label: 'GLM-5.2',
            provider: '智谱',
            type: '对话',
        }, {
            id: 'glm-5.3',
            label: 'GLM-5.3',
            provider: '智谱',
            type: '对话',
        }, {
            id: 'kimi-k3',
            label: 'Kimi K3',
            provider: '月之暗面',
            type: '对话',
        }, {
            id: 'doubao-seedance-2-0-260128',
            label: 'doubao-seedance-2-0-260128',
            provider: 'Bytedance',
            type: '视频',
        }, ];

        const API_BASE = 'https://api.godawnai.com/v1/chat/completions';

        // ============================================================
        //  状态
        // ============================================================
        let isStreaming = false;
        let abortController = null;
        let messageIdCounter = 0;

        // ============================================================
        //  DOM 引用
        // ============================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const apiKeyInput = $('#apiKey');
        const toggleKeyBtn = $('#toggleKey');
        const modelSelect = $('#modelSelect');
        const streamToggle = $('#streamToggle');
        const systemPromptInput = $('#systemPrompt');
        const userInput = $('#userInput');
        const sendBtn = $('#sendBtn');
        const chatMessages = $('#chatMessages');
        const clearChatBtn = $('#clearChatBtn');
        const saveConfigBtn = $('#saveConfigBtn');
        const statusBar = $('#statusBar');

        // ============================================================
        //  初始化模型下拉
        // ============================================================
        function populateModels() {
            modelSelect.innerHTML = '';
            MODELS.forEach((m) => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.label} (${m.provider})`;
                if (m.type === '视频') {
                    opt.textContent += ' 🎬';
                }
                modelSelect.appendChild(opt);
            });
            // 从 localStorage 恢复
            const saved = localStorage.getItem('godawnai_model');
            if (saved && MODELS.some((m) => m.id === saved)) {
                modelSelect.value = saved;
            }
        }
        populateModels();

        // ============================================================
        //  存储 / 恢复配置
        // ============================================================
        function loadConfig() {
            const key = localStorage.getItem('godawnai_api_key');
            if (key) apiKeyInput.value = key;
            const model = localStorage.getItem('godawnai_model');
            if (model && MODELS.some((m) => m.id === model)) modelSelect.value = model;
            const stream = localStorage.getItem('godawnai_stream');
            if (stream !== null) streamToggle.checked = stream === 'true';
            const sys = localStorage.getItem('godawnai_system');
            if (sys) systemPromptInput.value = sys;
        }

        function saveConfig() {
            localStorage.setItem('godawnai_api_key', apiKeyInput.value.trim());
            localStorage.setItem('godawnai_model', modelSelect.value);
            localStorage.setItem('godawnai_stream', String(streamToggle.checked));
            localStorage.setItem('godawnai_system', systemPromptInput.value.trim());
            setStatus('✅ 配置已保存', '#3fb950');
            setTimeout(() => setStatus('就绪'), 1800);
        }

        loadConfig();

        // ============================================================
        //  辅助
        // ============================================================
        function setStatus(text, color = '#8b949e') {
            statusBar.textContent = text;
            statusBar.style.color = color;
        }

        function getTimestamp() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function scrollToBottom() {
            const container = chatMessages;
            container.scrollTop = container.scrollHeight;
        }

        function createMessageElement(role, content, extra = {}) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.dataset.id = ++messageIdCounter;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '🧑' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const label = document.createElement('span');
            label.className = 'role-label';
            label.textContent = role === 'user' ? '你' : '助手';
            bubble.appendChild(label);

            const contentSpan = document.createElement('span');
            contentSpan.className = 'content-text';
            contentSpan.textContent = content || '';
            bubble.appendChild(contentSpan);

            if (extra.model) {
                const tag = document.createElement('span');
                tag.className = 'model-tag';
                tag.textContent = extra.model;
                bubble.appendChild(tag);
            }

            const time = document.createElement('span');
            time.className = 'timestamp';
            time.textContent = getTimestamp();
            bubble.appendChild(time);

            div.appendChild(avatar);
            div.appendChild(bubble);

            return div;
        }

        function getLastAssistantBubble() {
            const msgs = chatMessages.querySelectorAll('.msg.assistant');
            if (msgs.length === 0) return null;
            const last = msgs[msgs.length - 1];
            return last.querySelector('.bubble .content-text');
        }

        function getLastAssistantElement() {
            const msgs = chatMessages.querySelectorAll('.msg.assistant');
            if (msgs.length === 0) return null;
            return msgs[msgs.length - 1];
        }

        function removeEmptyState() {
            const empty = chatMessages.querySelector('.empty-state');
            if (empty) empty.remove();
        }

        function addUserMessage(text) {
            removeEmptyState();
            const el = createMessageElement('user', text);
            chatMessages.appendChild(el);
            scrollToBottom();
            return el;
        }

        function addAssistantMessage(text, model) {
            removeEmptyState();
            const el = createMessageElement('assistant', text, { model });
            chatMessages.appendChild(el);
            scrollToBottom();
            return el;
        }

        function updateAssistantContent(text) {
            const el = getLastAssistantElement();
            if (el) {
                const content = el.querySelector('.content-text');
                if (content) content.textContent = text;
                scrollToBottom();
            }
        }

        function showError(message) {
            removeEmptyState();
            const div = document.createElement('div');
            div.className = 'msg assistant';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '⚠️';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.style.borderColor = 'var(--accent-red)';
            const label = document.createElement('span');
            label.className = 'role-label';
            label.textContent = '错误';
            label.style.color = 'var(--accent-red)';
            bubble.appendChild(label);
            const content = document.createElement('span');
            content.className = 'content-text error-text';
            content.textContent = message;
            bubble.appendChild(content);
            const time = document.createElement('span');
            time.className = 'timestamp';
            time.textContent = getTimestamp();
            bubble.appendChild(time);
            div.appendChild(avatar);
            div.appendChild(bubble);
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function clearChat() {
            chatMessages.innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <h3>开始对话</h3>
                    <p>输入消息并点击发送，即可测试 GodawnAI 聚合平台的各种模型。</p>
                </div>
            `;
            // 清除流式状态
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            isStreaming = false;
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<span>发送</span>';
            setStatus('已清空');
            setTimeout(() => setStatus('就绪'), 1200);
        }

        // ============================================================
        //  核心 API 调用
        // ============================================================
        async function sendMessage() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                showError('请先输入 API Key');
                apiKeyInput.focus();
                return;
            }

            const userText = userInput.value.trim();
            if (!userText) {
                showError('请输入消息内容');
                userInput.focus();
                return;
            }

            const model = modelSelect.value;
            const useStream = streamToggle.checked;
            const system = systemPromptInput.value.trim();

            // 禁用发送按钮
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="spinner"></span> 发送中';
            setStatus('⏳ 请求中…', '#58a6ff');

            // 添加用户消息
            addUserMessage(userText);
            userInput.value = '';
            userInput.style.height = 'auto';

            // 占位助手消息
            const assistantPlaceholder = addAssistantMessage('', model);
            // 获取 content 元素用于流式更新
            const contentSpan = assistantPlaceholder.querySelector('.content-text');
            // 添加一个光标
            const cursor = document.createElement('span');
            cursor.className = 'streaming-cursor';
            contentSpan.appendChild(cursor);

            let fullContent = '';
            let errorOccurred = false;

            try {
                const messages = [];
                if (system) {
                    messages.push({ role: 'system', content: system });
                }
                messages.push({ role: 'user', content: userText });

                const body = {
                    model: model,
                    messages: messages,
                    stream: useStream,
                };

                abortController = new AbortController();

                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body),
                    signal: abortController.signal,
                });

                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try {
                        const errData = await response.json();
                        errMsg = errData.error?.message || errData.message || errMsg;
                    } catch (_) { /* ignore */ }
                    throw new Error(errMsg);
                }

                if (useStream) {
                    // ---- 流式 ----
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed === 'data: [DONE]') continue;
                            if (!trimmed.startsWith('data: ')) continue;

                            try {
                                const json = JSON.parse(trimmed.slice(6));
                                const delta = json.choices?.[0]?.delta?.content;
                                if (delta !== undefined && delta !== null) {
                                    fullContent += delta;
                                    // 更新显示（光标保留在末尾）
                                    const textNode = document.createTextNode(delta);
                                    contentSpan.insertBefore(textNode, cursor);
                                    scrollToBottom();
                                }
                            } catch (_) { /* 忽略解析错误 */ }
                        }
                    }

                    // 移除光标
                    if (cursor.parentNode) cursor.remove();

                    // 如果没有任何内容，显示空占位
                    if (!fullContent) {
                        fullContent = '(空响应)';
                        contentSpan.textContent = fullContent;
                    } else {
                        // 确保最终内容完整
                        contentSpan.textContent = fullContent;
                    }

                    setStatus('✅ 流式完成', '#3fb950');

                } else {
                    // ---- 非流式 ----
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content;
                    if (content !== undefined && content !== null) {
                        fullContent = content;
                        contentSpan.textContent = fullContent;
                        // 移除光标
                        if (cursor.parentNode) cursor.remove();
                    } else {
                        throw new Error('响应中未找到内容');
                    }
                    setStatus('✅ 请求完成', '#3fb950');
                }

            } catch (err) {
                errorOccurred = true;
                // 移除光标
                if (cursor.parentNode) cursor.remove();
                // 如果错误是因为用户取消，不显示错误
                if (err.name === 'AbortError') {
                    contentSpan.textContent = '(已取消)';
                    setStatus('⏹️ 已取消', '#f85149');
                } else {
                    contentSpan.textContent = `❌ ${err.message || '未知错误'}`;
                    contentSpan.style.color = 'var(--accent-red)';
                    setStatus(`❌ ${err.message}`, '#f85149');
                }
            } finally {
                abortController = null;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<span>发送</span>';
                if (!errorOccurred && !fullContent) {
                    // 如果内容为空，补一个占位
                    if (contentSpan && !contentSpan.textContent.trim()) {
                        contentSpan.textContent = '(空响应)';
                    }
                }
                // 如果流式完成但没有错误，状态已经是成功
                if (!errorOccurred && !fullContent) {
                    setStatus('就绪');
                }
                // 滚动到底部
                scrollToBottom();
            }
        }

        // ============================================================
        //  事件绑定
        // ============================================================

        // 发送按钮
        sendBtn.addEventListener('click', sendMessage);

        // Ctrl+Enter / Cmd+Enter 发送
        userInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
            // Shift+Enter 换行 (默认)
        });

        // 自动调整高度
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
        });

        // 切换 API Key 可见性
        toggleKeyBtn.addEventListener('click', () => {
            const isPassword = apiKeyInput.type === 'password';
            apiKeyInput.type = isPassword ? 'text' : 'password';
            toggleKeyBtn.textContent = isPassword ? '🙈' : '👁️';
        });

        // 清空对话
        clearChatBtn.addEventListener('click', () => {
            if (chatMessages.querySelectorAll('.msg').length === 0) return;
            if (confirm('确定要清空所有对话记录吗？')) {
                clearChat();
            }
        });

        // 保存配置
        saveConfigBtn.addEventListener('click', saveConfig);

        // 当模型改变时保存
        modelSelect.addEventListener('change', () => {
            localStorage.setItem('godawnai_model', modelSelect.value);
        });

        // 流式开关改变时保存
        streamToggle.addEventListener('change', () => {
            localStorage.setItem('godawnai_stream', String(streamToggle.checked));
        });

        // system prompt 保存 (失去焦点时)
        systemPromptInput.addEventListener('change', () => {
            localStorage.setItem('godawnai_system', systemPromptInput.value.trim());
        });

        // 点击空白区域聚焦输入
        document.addEventListener('click', (e) => {
            const target = e.target;
            if (target.closest('.chat-container') && !target.closest('.input-area') && !target.closest(
                    '.config-card')) {
                userInput.focus();
            }
        });

        // 页面加载后聚焦
        window.addEventListener('load', () => {
            setTimeout(() => userInput.focus(), 300);
        });

        // 如果有保存的 API Key，自动填充
        console.log('🧪 GodawnAI 测试台已加载');
        console.log('📋 可用模型:', MODELS.map(m => `${m.label} (${m.id})`).join(', '));

        // 快捷键：Ctrl+Shift+C 清空
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                if (chatMessages.querySelectorAll('.msg').length > 0) {
                    if (confirm('清空对话？')) clearChat();
                }
            }
        });

        // ============================================================
        //  额外功能：模型信息提示
        // ============================================================
        modelSelect.addEventListener('change', () => {
            const id = modelSelect.value;
            const model = MODELS.find(m => m.id === id);
            if (model) {
                const typeEmoji = model.type === '视频' ? '🎬' : '💬';
                setStatus(`${typeEmoji} ${model.label} (${model.provider})`, '#8b949e');
                setTimeout(() => setStatus('就绪'), 1500);
            }
        });

        // 处理可能的 CORS 问题提示
        console.log('💡 如果遇到 CORS 错误，请使用浏览器插件或代理进行跨域请求。');

        // 暴露一些变量到控制台方便调试
        window.__debug = {
            sendMessage,
            clearChat,
            saveConfig,
            MODELS,
            API_BASE,
        };
    </script>
</body>
</html>
